services:
  # Backend API Web Service (Free Tier)
  - type: web
    name: sheguard-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e forensic_ai"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FORENSIC_CHECKPOINT_DIR
        value: /opt/render/project/src/backend/forensic_ai/outputs/checkpoints

  # Frontend React Static Site (Free Tier)
  - type: static
    name: sheguard-app
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: http://sheguard-api/*
