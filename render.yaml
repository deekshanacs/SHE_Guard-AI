services:
  # Backend API Web Service (Free Tier)
  - type: web
    name: sheguard-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e forensic_ai"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FORENSIC_CHECKPOINT_DIR
        value: /opt/render/project/src/backend/forensic_ai/outputs/checkpoints
      - key: DATABASE_URL
        fromDatabase:
          name: sheguard-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://sheguard-app.onrender.com,https://shetrails.onrender.com,http://localhost:7860,http://localhost:8080

  # Frontend React Static Site (Free Tier)
  - type: web
    name: sheguard-app
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sheguard-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sheguard-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

# Add a managed Postgres database for persistent storage. The backend's
# `DATABASE_URL` value is populated from this database's connection string.
databases:
  - name: sheguard-db
    # Let Render pick a reasonable default; you can change the plan in the
    # dashboard if you need larger storage or different instance class.
    # plan: basic-256mb
    postgresMajorVersion: "15"
